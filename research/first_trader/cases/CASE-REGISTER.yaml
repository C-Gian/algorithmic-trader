version: 1
purpose: "RP-001 causal case library for concept formalization (not performance estimation)."
anti_bias:
  - "No P&L sorting; adverse, ambiguous and data-loss cases included deliberately."
  - "Synthetic cases prove predicate mechanics only; they are authored and are not evidence of BTC behavior."
  - "Real grid cases are fixed by SELECTION-PROTOCOL.md before acquisition; labels frozen before outcomes are exported."
  - "Prefix and outcome live in separate directories (prefixes/, outcomes/)."
common_synthetic_inputs: "prefixes/SYN-CONTEXTS.yaml (declared 1h contexts); S5 = 60.0 unless stated"
cases:
  - {case_id: SYN-L01, evidence: SYNTHETIC, direction: LONG, category: clean_continuation,
     source: "prefixes/SYN-L01.yaml (authored)", cutoff: "2000-01-01T10:52Z", allowed_evidence: "declared context/swings; 5m bars to 10:45; 1m bars to 10:51",
     hidden_outcome: "outcomes/SYN-L01.yaml", question: "Full path to trigger with cost UNRESOLVED",
     expected: "ARMED rev2 at 10:50; trigger 10:52; NO_TRADE COST_OR_DELAY_VIABILITY_UNRESOLVED; scenario activated",
     notes: "Geometry exactly at the 1.0 floor (G = Rd)", selection_reason: "mechanics: complete long path + cost gate"}
  - {case_id: SYN-L05, evidence: SYNTHETIC, direction: LONG, category: clean_continuation,
     source: "prefixes/SYN-L05.yaml", cutoff: "2000-01-01T14:07Z", allowed_evidence: "5m to 14:00, 1m to 14:06",
     hidden_outcome: "outcomes/SYN-L05.yaml", question: "All gates pass -> LONG; entry window closure; delay effect",
     expected: "LONG at 14:07 (VIABLE, 68.6 bps room)", notes: "Re-anchoring across 4 revisions", selection_reason: "mechanics: issuance path"}
