# Local application stack.
#   docker compose up --build     then open http://localhost:8000
name: algotrader

x-app: &app
  build: .
  image: algotrader-app:local
  environment:
    ALGOTRADER_DATABASE_URL: postgresql://algotrader:algotrader@db:5432/algotrader
    ALGOTRADER_ARTIFACT_ROOT: /data/artifacts
    ALGOTRADER_DATA_ROOT: /data/market
    ALGOTRADER_CODE_VERSION: ${ALGOTRADER_CODE_VERSION:-unknown}
  volumes:
    - artifacts:/data/artifacts
    - marketdata:/data/market

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: algotrader
      POSTGRES_PASSWORD: algotrader # local-only credential; no external exposure
      POSTGRES_DB: algotrader
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algotrader -d algotrader"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["algotrader", "migrate"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: ["algotrader", "api", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: ["algotrader", "worker", "--lease-seconds", "10"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # A dead worker (e.g. the DEMO crash fault) is restarted; it reclaims the
    # run after the lease expires and resumes from the last checkpoint.
    restart: unless-stopped

  recorder:
    <<: *app
    # Public, read-only OKX market recorder (no credentials, no trading). Idle until a session
    # is started from the Recorder view / API. Endpoints are configurable for regional OKX domains via
    # ALGOTRADER_OKX_WS_PUBLIC_URL / ALGOTRADER_OKX_WS_BUSINESS_URL / ALGOTRADER_OKX_BASE_URL.
    command: ["algotrader", "recorder-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # A crashed recorder is restarted; its interrupted session is recovered as PARTIAL (not resumed).
    restart: unless-stopped

  observer:
    <<: *app
    # Real-market observation replay (observation only; no interpretation, no trading). Replays
    # verified datasets / finalized recordings from the data volume through the causal feed.
    command: ["algotrader", "observe-worker", "--lease-seconds", "10"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # A dead observer is restarted; it reclaims the replay after the lease expires and resumes
    # after the last committed feed cursor.
    restart: unless-stopped

  corpus:
    <<: *app
    # Corpus preparation (public, read-only OKX REST; no credentials, no trading). Idle until the Owner
    # clicks Prepare on the Backtest page. A crashed worker is restarted; the interrupted monthly chunk is
    # reclaimed after its lease expires and acquired again from scratch (no byte-level resume).
    command: ["algotrader", "corpus-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  artifacts:
  marketdata:
